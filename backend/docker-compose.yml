services:
  postgres:
    image: postgres:16-alpine
    container_name: reclicla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclicla
      POSTGRES_PASSWORD: reclicla
      POSTGRES_DB: reclicla
    ports:
      - "5433:5432"
    volumes:
      - reclicla-postgres-data:/var/lib/postgresql/data

volumes:
  reclicla-postgres-data:
